$kind: http-request
method: POST
url: '{{baseUrl}}/dining-sessions'
order: 2000
body:
  type: json
  content: |-
    {
      "tableToken": "{{tableToken}}"
    }
headers:
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('Expected status 201', () => pm.expect(pm.response.code).to.eql(201));
examples: './.resources/createDiningSession.resources/examples/'
