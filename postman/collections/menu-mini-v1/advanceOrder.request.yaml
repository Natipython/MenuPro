$kind: http-request
method: PATCH
url: '{{baseUrl}}/merchant/orders/{{orderId}}'
order: 7000
body:
  type: json
  content: |-
    {
      "status": "ACCEPTED"
    }
headers:
- key: If-Match
  value: '"1"'
- key: Cookie
  value: 'menu_staff_session={{staffSession}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('Expected status 200', () => pm.expect(pm.response.code).to.eql(200));
    pm.test('Accepting an order does not settle payment', () => { const o=pm.response.json(); pm.expect(o.status).to.eql('ACCEPTED'); pm.expect(o.paymentStatus).to.eql('UNPAID'); });
examples: './.resources/advanceOrder.resources/examples/'
