$kind: http-request
method: PUT
url: '{{baseUrl}}/merchant/venues/{{venueId}}/menu-draft'
order: 11000
body:
  type: json
  content: |-
    {
      "themeId": "mini-warm-habesha",
      "primaryColor": "#F59E0B",
      "sections": [
        {
          "id": "00000000-0000-4000-8000-000000000501",
          "nameEn": "Coffee",
          "items": [
            {
              "id": "00000000-0000-4000-8000-000000000601",
              "nameEn": "Macchiato",
              "basePrice": "70.00",
              "availableNow": true,
              "modifiers": []
            }
          ]
        }
      ]
    }
headers:
- key: If-Match
  value: '"1"'
- key: Cookie
  value: 'menu_staff_session={{staffSession}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('Expected status 200', () => pm.expect(pm.response.code).to.eql(200));
examples: './.resources/replaceMenuDraft.resources/examples/'
