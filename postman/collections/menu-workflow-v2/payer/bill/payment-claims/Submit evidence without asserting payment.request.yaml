$kind: http-request
description: Submit evidence without asserting payment Same guest and bill binding,
  expiry, revocation and CSRF are checked server-side. No caller UUID/header is identity.
  Shared details exclude other diners notes and payment references. A transfer report
  records no received or allocated funds. Destination changes and duplicate pending/recorded
  references require cashier review. No bank transfer is initiated. Independent fictional
  scenario; protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/payer/bill/payment-claims'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 368c570a-3d26-5674-a7f0-8bdd137b6658
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: __Host-menu_bill_access={{billAccess}}; __Host-menu_dining={{diningSession}}
body:
  type: json
  content: "{\n  \"accountId\": \"00000000-0000-4000-8000-000000000811\",\n  \"providerReference\"\
    : \"FICTIONAL-TXN-ONE\",\n  \"reportedAmount\": \"70.00\",\n  \"destinationFingerprint\"\
    : \"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\",\n  \"\
    transferSent\": true\n}"
settings: {}
examples: ./.resources/Submit evidence without asserting payment.resources/examples
order: 1000
name: submitBillClaim
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
