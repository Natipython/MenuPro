$kind: http-request
name: activateMiniBranchQuote
description: Requires an accepted, unexpired offer and verified subscription billing
  evidence. Applies the quote term once, keeps plan MINI, and never creates the second
  branch automatically. Initial manual billing only; renewal and invoice reconciliation
  handlers remain pending. Independent fictional scenario; protected operations require
  matching backend fixtures and ephemeral authenticated sessions. Not a runnable restaurant
  transaction sequence.
url: '{{baseUrl}}/platform/mini-branch-quotes/:quoteId/activation'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: eaa0b160-ef14-5aa6-ad27-24362d498dd9
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_platform_session={{platformSession}}
pathVariables:
- key: quoteId
  value: '{{quoteId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"billingEvidenceReference\": \"FICTIONAL-VERIFIED-SAAS-ADDON\"\n\
    }"
settings: {}
examples: ./.resources/Record verified subscription billing and activate two-branch
  Min.resources/examples
order: 3000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
