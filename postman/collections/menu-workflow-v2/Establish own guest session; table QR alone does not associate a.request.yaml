$kind: http-request
name: createDiningSession
description: Establish own guest session; table QR alone does not associate a visit
  Cookie capability is verified server-side on every request. UUIDs and client identity
  headers grant no access. Mutations require exact Origin and bounded JSON; authenticated
  mutations also require session-bound CSRF. Table access never grants a visit or
  payer access. No private token appears in URLs or server logs. Session creation
  never silently replaces an existing session. Independent fictional scenario; protected
  operations require matching backend fixtures and ephemeral authenticated sessions.
  Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/dining-sessions'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 6e28b5d3-7f56-5a72-89af-74e21231c482
- key: Origin
  value: '{{origin}}'
body:
  type: json
  content: "{\n  \"tableToken\": \"FICTIONAL_TABLE_TTTTTTTTTTTTTTTTTTTTTTTTTT0\",\n\
    \  \"sessionNonce\": \"FICTIONAL_NONCE_NNNNNNNNNNNNNNNNNNNNNNNNNN0\"\n}"
settings: {}
examples: ./.resources/Establish own guest session; table QR alone does not associate
  a.resources/examples
order: 2000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Money fields are exact decimal strings\", () => {\n  function\
    \ check(v) { if (v && typeof v === \"object\") Object.keys(v).forEach(k => {\n\
    \    if (/(Amount|Price|Total)$/.test(k) && !(k === \"verifiedReceivedAmount\"\
    \ && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\.[0-9]{2}$/);\n\
    \    else check(v[k]); }); }\n  check(pm.response.json());\n});"
