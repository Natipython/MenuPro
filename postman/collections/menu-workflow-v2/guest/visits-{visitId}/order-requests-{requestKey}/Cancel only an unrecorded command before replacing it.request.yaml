$kind: http-request
description: Original actor, business, branch and target scope are resolved and authorized.
  No command bodies or secrets are returned. COMMITTED identifies the original result,
  not current operational state. NOT_RECORDED never proves a delayed request cannot
  commit. Cancellation requires Idempotency-Key equal to requestKey in the path and
  serializes with original commands, persisting a tombstone, or returns COMMITTED
  if the original won. Ten new cancellations per actor/branch/minute; repeat cancellation
  is safe. A cancellation never reverses committed business facts. No automatic replay
  or fund transfer. HTTP merchant access stays closed while OTP is deferred. Independent
  fictional scenario; protected operations require matching backend fixtures and ephemeral
  authenticated sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/guest/visits/:visitId/order-requests/:requestKey/cancellation'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: '{{requestKey}}'
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: __Host-menu_dining={{diningSession}}
pathVariables:
- key: visitId
  value: '{{visitId}}'
  disabled: false
  description: '(Required) '
- key: requestKey
  value: '{{requestKey}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: '{}'
settings: {}
examples: ./.resources/Cancel only an unrecorded command before replacing it.resources/examples
order: 2000
name: cancelGuestOrderRequest
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
