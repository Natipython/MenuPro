$kind: http-request
name: allocateReceipt
description: Allocate receipt to its original visit bill without double counting funds
  Manual settlement records evidence; it never moves money. Receipt and allocation
  are separate. Exact original responses survive retries. Real identity, receiving-account
  procedures and field acceptance remain pending. Independent fictional scenario;
  protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/receipts/:receiptId/allocations'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 6e5c9665-3b2a-50db-9f5d-7c54f45dfb2e
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: receiptId
  value: '{{receiptId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"billId\": \"00000000-0000-4000-8000-000000000801\",\n  \"expectedBillVersion\"\
    : 4,\n  \"amount\": \"70.00\"\n}"
settings: {}
examples: ./.resources/Allocate receipt to its original visit bill without double
  count.resources/examples
order: 1000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
