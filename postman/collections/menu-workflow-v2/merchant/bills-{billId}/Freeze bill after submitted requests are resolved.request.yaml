$kind: http-request
description: Freeze bill after submitted requests are resolved Manual settlement records
  evidence; it never moves money. Receipt and allocation are separate. Exact original
  responses survive retries. Real identity, receiving-account procedures and field
  acceptance remain pending. Independent fictional scenario; protected operations
  require matching backend fixtures and ephemeral authenticated sessions. Not a runnable
  restaurant transaction sequence.
url: '{{baseUrl}}/merchant/bills/:billId/finalizations'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 2ef619a8-ee62-5855-bdcd-dd930f602c2a
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: billId
  value: '{{billId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 3\n}"
settings: {}
examples: ./.resources/Freeze bill after submitted requests are resolved.resources/examples
order: 3000
name: finalizeBill
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
