$kind: http-request
name: requestMiniSecondBranch
description: Request a price increase for a second branch while staying on MenuMini
  Independent fictional scenario; protected operations require matching backend fixtures
  and ephemeral authenticated sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/mini-second-branch-requests'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: f22e0954-c27d-54c8-a812-bc104ceb56f9
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
body:
  type: json
  content: '{}'
settings: {}
examples: ./.resources/Request a price increase for a second branch while staying
  on Me.resources/examples
order: 12000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
