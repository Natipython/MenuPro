$kind: http-request
description: Record actual executed refund; does not initiate fund transfer Manual
  settlement records evidence; it never moves money. Receipt and allocation are separate.
  Exact original responses survive retries. Real identity, receiving-account procedures
  and field acceptance remain pending. Independent fictional scenario; protected operations
  require matching backend fixtures and ephemeral authenticated sessions. Not a runnable
  restaurant transaction sequence.
url: '{{baseUrl}}/merchant/refund-requests/:refundId/executions'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: dea53ef7-1bb7-57c4-92b5-af9b69795212
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: refundId
  value: '{{refundId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 2,\n  \"executionReference\": \"FICTIONAL-REFUND-EXECUTED\"\
    ,\n  \"executionConfirmed\": true\n}"
settings: {}
examples: ./.resources/Record actual executed refund; does not initiate fund transfer.resources/examples
order: 2000
name: executeRefund
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
