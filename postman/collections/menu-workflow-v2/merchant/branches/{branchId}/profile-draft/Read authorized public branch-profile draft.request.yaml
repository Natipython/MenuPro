$kind: http-request
description: Read authorized public branch-profile draft Requires trusted identity,
  business/branch permissions and exact versions. HTTP editing is locked until the
  identity adapter exists; caller headers/UUIDs are not accepted as identity. Database
  commands have exact-body idempotency and atomic audit/outbox records. Independent
  fictional scenario; protected operations require matching backend fixtures and ephemeral
  authenticated sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/branches/:branchId/profile-draft'
method: GET
headers:
- key: Accept
  value: application/json
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: branchId
  value: '{{branchId}}'
  disabled: false
  description: '(Required) '
settings: {}
examples: ./.resources/Read authorized public branch-profile draft.resources/examples
order: 1000
name: getBranchProfile
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
