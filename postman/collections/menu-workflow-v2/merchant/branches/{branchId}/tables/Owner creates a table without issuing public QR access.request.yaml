$kind: http-request
description: Owner creates a table without issuing public QR access Staff-assisted
  dine-in slice; no customer/payer token or table QR secret is returned. Commands
  retain exact original responses. Acceptance and serving do not record payment. A
  changed publication or reviewed pricing fingerprint requires confirmation. Real
  identity and field acceptance remain pending. Independent fictional scenario; protected
  operations require matching backend fixtures and ephemeral authenticated sessions.
  Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/branches/:branchId/tables'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: be358a6f-651e-5d42-b711-c53468883e00
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: branchId
  value: '{{branchId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"label\": \"Table 1\"\n}"
settings: {}
examples: ./.resources/Owner creates a table without issuing public QR access.resources/examples
order: 2000
name: createDiningTable
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
