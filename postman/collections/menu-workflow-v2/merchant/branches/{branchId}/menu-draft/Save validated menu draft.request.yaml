$kind: http-request
description: Save validated menu draft Requires trusted identity, business/branch
  permissions and exact versions. HTTP editing is locked until the identity adapter
  exists; caller headers/UUIDs are not accepted as identity. Database commands have
  exact-body idempotency and atomic audit/outbox records. Independent fictional scenario;
  protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/branches/:branchId/menu-draft'
method: PUT
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 8e31212d-7dbf-5311-b9d5-8acd3bbef506
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: branchId
  value: '{{branchId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 1,\n  \"content\": {\n    \"themeId\": \"mini-warm-habesha\"\
    ,\n    \"primaryColor\": \"#F59E0B\",\n    \"sections\": [\n      {\n        \"\
    id\": \"00000000-0000-4000-8000-000000000501\",\n        \"nameEn\": \"Coffee\"\
    ,\n        \"items\": [\n          {\n            \"id\": \"00000000-0000-4000-8000-000000000601\"\
    ,\n            \"nameEn\": \"Macchiato\",\n            \"basePrice\": \"70.00\"\
    ,\n            \"availableNow\": true,\n            \"modifiers\": []\n      \
    \    }\n        ]\n      }\n    ]\n  }\n}"
settings: {}
examples: ./.resources/Save validated menu draft.resources/examples
order: 1000
name: saveMenuDraft
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
