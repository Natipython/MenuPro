$kind: http-request
description: Change availability without publishing draft prices Independent fictional
  scenario; protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/branches/:branchId/items/:itemId/availability'
method: PUT
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: dad26bf4-f639-595b-a5d4-961eabb70aef
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: branchId
  value: '{{branchId}}'
  disabled: false
  description: '(Required) '
- key: itemId
  value: '{{itemId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedRevision\": 1,\n  \"available\": false,\n  \"reason\":\
    \ \"Sold out\"\n}"
settings: {}
examples: ./.resources/Change availability without publishing draft prices.resources/examples
order: 7000
name: setAvailability
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
