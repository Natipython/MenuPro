$kind: http-request
description: Save service preparation without activating ordering Prepared staffing,
  tables and payment methods do not create grants, tables, receiving accounts or plan
  entitlement. No ordering activation occurs. Readiness is PREPARATION_ONLY until
  connected transaction and field acceptance gates are complete. Independent fictional
  scenario; protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/branches/:branchId/service-draft'
method: PUT
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 6d2f9f90-3619-5005-907b-f9c66a29016c
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: branchId
  value: '{{branchId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 0,\n  \"content\": {\n    \"tableLabels\": [\n\
    \      \"Table 1\"\n    ],\n    \"staffing\": {\n      \"orders\": \"OWNER\",\n\
    \      \"preparation\": \"STAFF\",\n      \"payments\": \"OWNER\"\n    },\n  \
    \  \"paymentMethods\": [\n      \"CASH\",\n      \"BANK_TRANSFER\"\n    ],\n \
    \   \"pricing\": \"UNCONFIRMED\"\n  }\n}"
settings: {}
examples: ./.resources/Save service preparation without activating ordering.resources/examples
order: 2000
name: saveServiceDraft
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
