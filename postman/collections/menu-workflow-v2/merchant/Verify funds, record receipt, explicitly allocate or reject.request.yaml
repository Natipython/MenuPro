$kind: http-request
description: Verify funds, record receipt, explicitly allocate or reject Manual settlement
  records evidence; it never moves money. Receipt and allocation are separate. Exact
  original responses survive retries. Real identity, receiving-account procedures
  and field acceptance remain pending. Independent fictional scenario; protected operations
  require matching backend fixtures and ephemeral authenticated sessions. Not a runnable
  restaurant transaction sequence.
url: '{{baseUrl}}/merchant/payment-claims/:claimId/reviews'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: 990e74a8-22dd-5058-8eab-8841ba270b63
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: claimId
  value: '{{claimId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 1,\n  \"decision\": \"APPROVE\",\n  \"verifiedAmount\"\
    : \"70.00\",\n  \"allocationAmount\": \"70.00\",\n  \"verificationNote\": \"Fictional\
    \ credited funds checked\",\n  \"fundsConfirmed\": true\n}"
settings: {}
examples: ./.resources/Verify funds, record receipt, explicitly allocate or reject.resources/examples
order: 8000
name: reviewBillClaim
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
