$kind: http-request
description: Staff revokes a scoped payer grant without changing bill amounts Requires
  payments.record for this business/branch. Device codes identify a server-listed
  session and grant no access. Issuance checks bill version, binds a joined active
  session, rotates previous grants and returns active status on stable issuance replay.
  No plaintext token is stored in SQL results/events. Independent fictional scenario;
  protected operations require matching backend fixtures and ephemeral authenticated
  sessions. Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/merchant/bill-access-grants/:grantId/revocation'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: a382dac9-b521-511e-b67b-f9504f126581
- key: Origin
  value: '{{origin}}'
- key: X-CSRF-Token
  value: '{{csrfToken}}'
- key: Cookie
  value: menu_staff_session={{staffSession}}
pathVariables:
- key: grantId
  value: '{{grantId}}'
  disabled: false
  description: '(Required) '
body:
  type: json
  content: "{\n  \"expectedVersion\": 3\n}"
settings: {}
examples: ./.resources/Staff revokes a scoped payer grant without changing bill amounts.resources/examples
order: 7000
name: revokeBillGrant
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});"
