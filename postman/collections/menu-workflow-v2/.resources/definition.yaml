$kind: collection
name: MenuMini workflow v2 design contract
description: '73 operations: four functional public validation/menu operations, seventeen
  guest/payer capability operations requiring an explicitly configured limited connection,
  and 40 private merchant boundaries locked until verified identity exists; 12 operations
  remain target contracts. Server adapters and database commands have isolated fictional
  evidence, not real authenticated HTTP acceptance. OTP is deferred. Unverified preparation
  and the fictional browser rehearsal never create a business, activate a plan or
  publish a menu. MenuMini has a maximum of two active branches; branch two requires
  quoted owner price consent and verified SaaS billing. Visit/bill settlement replaces
  order-linked v1 settlement. Restaurant receipts and SaaS subscription billing are
  separate. Protected and current public-menu responses are no-store. Server-derived
  identity, totals, permissions and capabilities are never taken from client assertions.
  Auth values are intentionally empty. Do not persist real session values or upload
  them. Each request is an independent scenario with its own matching fixtures.'
