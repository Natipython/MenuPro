scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Money fields are exact decimal strings\", () => {\n  function\
    \ check(v) { if (v && typeof v === \"object\") Object.keys(v).forEach(k => {\n\
    \    if (/(Amount|Price|Total)$/.test(k) && !(k === \"verifiedReceivedAmount\"\
    \ && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\.[0-9]{2}$/);\n\
    \    else check(v[k]); }); }\n  check(pm.response.json());\n});"
