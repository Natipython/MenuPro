$kind: http-request
name: validateSetupDraft
description: Implemented stateless validation. Same Origin and application/json required;
  body limit 256 KB. Exactly one first-branch draft; no branch entitlement, identity,
  OTP, persistence, billing, invitations or publication. Does not echo the draft or
  private contacts. Pro is an expression of interest, not an available paid entitlement.
  Unspecified hours are not interpreted as open. Money is an exact two-decimal string.
  Retry is safe without an idempotency key. Independent fictional scenario; protected
  operations require matching backend fixtures and ephemeral authenticated sessions.
  Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/onboarding/setup-validation'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Origin
  value: '{{origin}}'
body:
  type: json
  content: "{\n  \"format\": \"menumini-setup-draft\",\n  \"version\": 1,\n  \"businessTypeId\"\
    : \"cafe-and-restaurant\",\n  \"branch\": {\n    \"publicName\": \"Fictional Addis\
    \ Cafe\",\n    \"name\": \"Main branch\",\n    \"city\": \"Addis Ababa\",\n  \
    \  \"area\": \"Bole\",\n    \"landmark\": \"Fictional landmark\",\n    \"serviceMode\"\
    : \"DINE_IN\",\n    \"currency\": \"ETB\",\n    \"timezone\": \"Africa/Addis_Ababa\"\
    ,\n    \"hours\": [\n      {\n        \"day\": 0,\n        \"status\": \"UNSPECIFIED\"\
    \n      },\n      {\n        \"day\": 1,\n        \"status\": \"UNSPECIFIED\"\n\
    \      },\n      {\n        \"day\": 2,\n        \"status\": \"UNSPECIFIED\"\n\
    \      },\n      {\n        \"day\": 3,\n        \"status\": \"UNSPECIFIED\"\n\
    \      },\n      {\n        \"day\": 4,\n        \"status\": \"UNSPECIFIED\"\n\
    \      },\n      {\n        \"day\": 5,\n        \"status\": \"UNSPECIFIED\"\n\
    \      },\n      {\n        \"day\": 6,\n        \"status\": \"UNSPECIFIED\"\n\
    \      }\n    ]\n  },\n  \"planPreference\": \"MINI\",\n  \"menu\": {\n    \"\
    themeId\": \"mini-warm-habesha\",\n    \"sections\": [\n      {\n        \"id\"\
    : \"00000000-0000-4000-8000-000000000950\",\n        \"name\": \"Coffee\",\n \
    \       \"items\": [\n          {\n            \"id\": \"00000000-0000-4000-8000-000000000951\"\
    ,\n            \"name\": \"Fictional coffee\",\n            \"nameAm\": \"ሙከራ\
    \ ቡና\",\n            \"price\": \"60.50\",\n            \"available\": true\n\
    \          }\n        ]\n      }\n    ]\n  }\n}"
settings: {}
examples: ./.resources/Check a first-branch and menu preparation draft without activati.resources/examples
order: 2000
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});\n\
    pm.test(\"Draft preparation cannot activate access or publication\", () => {\n\
    \  const b=pm.response.json(); pm.expect(b.mode).to.equal(\"DRAFT_ONLY\");\n \
    \ pm.expect(b.nextStep).to.equal(\"VERIFY_BEFORE_LAUNCH\"); pm.expect(b).not.to.have.property(\"\
    branch\");\n  pm.expect(b).not.to.have.property(\"session\"); pm.expect(b.blockers).to.include(\"\
    PHONE_VERIFICATION\");\n  pm.expect(pm.response.headers.has(\"Set-Cookie\")).to.equal(false);\n\
    });"
