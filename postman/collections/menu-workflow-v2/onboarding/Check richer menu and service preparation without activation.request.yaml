$kind: http-request
description: Stateless same-origin JSON validation; body limit 1152 KB, menu component
  1 MB, profile and service components 16 KB each. Returns counts and blockers only.
  No submitted content, sessions, identity, persistence, staff grants, tables, billing,
  receiving accounts or publication. Exact prices and modifier selection rules are
  enforced. Safe retry needs no idempotency key. Independent fictional scenario; protected
  operations require matching backend fixtures and ephemeral authenticated sessions.
  Not a runnable restaurant transaction sequence.
url: '{{baseUrl}}/onboarding/workspace-validation'
method: POST
headers:
- key: Accept
  value: application/json
- key: Content-Type
  value: application/json
- key: Origin
  value: '{{origin}}'
body:
  type: json
  content: "{\n  \"format\": \"menumini-workspace-draft\",\n  \"version\": 1,\n  \"\
    planPreference\": \"MINI\",\n  \"profile\": {\n    \"businessTypeId\": \"cafe-and-restaurant\"\
    ,\n    \"branch\": {\n      \"publicName\": \"Fictional Addis Cafe\",\n      \"\
