settings: {}
examples: ./.resources/Check richer menu and service preparation without activation.resources/examples
order: 3000
name: validateWorkspacePreparation
scripts:
- type: afterResponse
  language: text/javascript
  code: "pm.test(\"Command succeeds for its prepared fixture\", () => pm.expect(pm.response.code).to.be.within(200,\
    \ 299));\npm.test(\"Private response is not cached\", () => pm.expect(pm.response.headers.get(\"\
    Cache-Control\") || \"\").to.include(\"no-store\"));\npm.test(\"Money fields are\
    \ exact decimal strings\", () => {\n  function check(v) { if (v && typeof v ===\
    \ \"object\") Object.keys(v).forEach(k => {\n    if (/(Amount|Price|Total)$/.test(k)\
    \ && !(k === \"verifiedReceivedAmount\" && v[k] === null)) pm.expect(v[k]).to.match(/^(0|[1-9][0-9]{0,9})\\\
    .[0-9]{2}$/);\n    else check(v[k]); }); }\n  check(pm.response.json());\n});\n\
    pm.test(\"Workspace review cannot grant service or publication\", () => {\n  const\
    \ b=pm.response.json(); pm.expect(b.mode).to.equal(\"PREPARATION_ONLY\");\n  pm.expect(b).not.to.have.property(\"\
    profile\"); pm.expect(b).not.to.have.property(\"service\");\n  pm.expect(b.blockers).to.include(\"\
    BUSINESS_AUTHORIZATION\"); pm.expect(pm.response.headers.has(\"Set-Cookie\")).to.equal(false);\n\
    });"
