    Bole\",\n      \"landmark\": \"Fictional landmark\",\n      \"serviceMode\": \"\
    DINE_IN\",\n      \"currency\": \"ETB\",\n      \"timezone\": \"Africa/Addis_Ababa\"\
    ,\n      \"hours\": [\n        {\n          \"day\": 0,\n          \"status\"\
    : \"UNSPECIFIED\"\n        },\n        {\n          \"day\": 1,\n          \"\
    status\": \"UNSPECIFIED\"\n        },\n        {\n          \"day\": 2,\n    \
    \      \"status\": \"UNSPECIFIED\"\n        },\n        {\n          \"day\":\
    \ 3,\n          \"status\": \"UNSPECIFIED\"\n        },\n        {\n         \
    \ \"day\": 4,\n          \"status\": \"UNSPECIFIED\"\n        },\n        {\n\
    \          \"day\": 5,\n          \"status\": \"UNSPECIFIED\"\n        },\n  \
    \      {\n          \"day\": 6,\n          \"status\": \"UNSPECIFIED\"\n     \
    \   }\n      ]\n    }\n  },\n  \"menu\": {\n    \"themeId\": \"mini-warm-habesha\"\
    ,\n    \"primaryColor\": \"#F59E0B\",\n    \"sections\": [\n      {\n        \"\
    id\": \"00000000-0000-4000-8000-000000000501\",\n        \"nameEn\": \"Coffee\"\
    ,\n        \"items\": [\n          {\n            \"id\": \"00000000-0000-4000-8000-000000000601\"\
    ,\n            \"nameEn\": \"Macchiato\",\n            \"basePrice\": \"70.00\"\
