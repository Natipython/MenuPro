openapi: 3.1.0
info:
  title: MenuMini workflow v2 contract
  version: 0.11.0
  description: '73 operations: four functional public validation/menu operations,
    seventeen guest/payer capability operations requiring an explicitly configured
    limited connection, and 40 private merchant boundaries locked until verified identity
    exists; 12 operations remain target contracts. Server adapters and database commands
    have isolated fictional evidence, not real authenticated HTTP acceptance. OTP
    is deferred. Unverified preparation and the fictional browser rehearsal never
    create a business, activate a plan or publish a menu. MenuMini has a maximum of
    two active branches; branch two requires quoted owner price consent and verified
    SaaS billing. Visit/bill settlement replaces order-linked v1 settlement. Restaurant
    receipts and SaaS subscription billing are separate. Protected and current public-menu
    responses are no-store. Server-derived identity, totals, permissions and capabilities
    are never taken from client assertions.'
servers:
- url: http://localhost:5174/api/v2
  description: Intended local implementation only
paths:
  /public/venues/{venueSlug}/menu:
    get:
      operationId: getPublishedMenu
      summary: Read published menu with live availability
      description: Read published menu with live availability
      parameters:
      - name: venueSlug
        in: path
        required: true
        schema: &id007
          type: string
          minLength: 1
          maxLength: 160
      security: []
      responses:
        '200':
          description: Committed result or authorized projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenu'
              example:
                publicationId: 00000000-0000-4000-8000-000000000401
                revision: 1
                venueId: 00000000-0000-4000-8000-000000000101
                venueName: Example Cafe
                currency: ETB
                content:
                  themeId: mini-warm-habesha
                  primaryColor: '#F59E0B'
                  sections:
                  - id: 00000000-0000-4000-8000-000000000501
                    nameEn: Coffee
                    items:
                    - id: 00000000-0000-4000-8000-000000000601
                      nameEn: Macchiato
                      basePrice: '70.00'
                      availableNow: true
                      modifiers: []
                availabilityRevision: 1
                branch:
                  publicName: Fictional Addis Cafe
                  name: Main branch
                  city: Addis Ababa
                  area: Bole
                  landmark: Fictional landmark
                  serviceMode: DINE_IN
                  currency: ETB
                  timezone: Africa/Addis_Ababa
                  hours:
                  - day: 0
                    status: UNSPECIFIED
                  - day: 1
                    status: UNSPECIFIED
                  - day: 2
                    status: UNSPECIFIED
                  - day: 3
                    status: UNSPECIFIED
                  - day: 4
