components:
  schemas:
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
      examples:
      - '140.00'
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 1000
        code:
          type: string
          maxLength: 80
        requestId:
          type: string
          maxLength: 80
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                maxLength: 200
              code:
                type: string
                maxLength: 80
            required:
            - field
            - code
          minItems: 0
          maxItems: 100
      required:
      - type
      - title
      - status
      - detail
      - code
      - requestId
    CreateDiningSession:
      type: object
      additionalProperties: false
      properties:
        tableToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        sessionNonce:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Fresh client-generated cryptographic 32-byte secret. Retain
            with this command for exact retry; never use a UUID, URL or business identity.
            Request bodies must be redacted in logs.
      required:
      - tableToken
      - sessionNonce
    DiningSession:
      type: object
      additionalProperties: false
      properties:
        id: &id005
          type: string
          format: uuid
        venueId: *id005
        tableId: *id005
        tableLabel:
          type: string
          maxLength: 40
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - venueId
      - tableId
      - tableLabel
      - expiresAt
    OrderSelection:
      type: object
      additionalProperties: false
      properties:
        itemId: *id005
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        choiceIds:
          type: array
          items: *id005
          minItems: 0
          maxItems: 30
          uniqueItems: true
        specialInstructions:
          type: string
          maxLength: 500
      required:
      - itemId
      - quantity
      - choiceIds
    OrderStatus:
      type: string
      enum:
      - SUBMITTED
      - ACCEPTED
      - PREPARING
      - READY
      - COMPLETED
      - CANCELLED
    OrderLine:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        nameEn: &id017
          type: string
          maxLength: 160
        nameAm: &id018
          type: string
          maxLength: 160
        quantity: &id019
          type: integer
        unitPrice: &id020
          $ref: '#/components/schemas/Money'
        lineTotal: &id021
          $ref: '#/components/schemas/Money'
        selectedOptions: &id022
          type: array
          items:
            type: string
            maxLength: 120
          minItems: 0
          maxItems: 30
        specialInstructions:
          type: string
          maxLength: 500
      required:
      - id
      - nameEn
      - quantity
      - unitPrice
      - lineTotal
      - selectedOptions
    ChoiceDraft:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        label:
          type: string
          maxLength: 120
          minLength: 1
        priceDelta:
          type: string
          pattern: ^-?(0|[1-9][0-9]{0,9})\.[0-9]{2}$
        isAvailable:
          type: boolean
      required:
      - id
      - label
      - priceDelta
      - isAvailable
    ModifierDraft:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        label:
          type: string
          maxLength: 120
          minLength: 1
        mode:
          type: string
          enum:
          - SINGLE_SELECT
          - MULTI_SELECT
        minSelections:
          type: integer
          minimum: 0
          maximum: 30
        maxSelections:
          type: integer
          minimum: 1
          maximum: 30
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceDraft'
          minItems: 1
          maxItems: 30
      required:
      - id
      - label
      - mode
      - minSelections
      - maxSelections
      - choices
    ItemDraft:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        nameEn:
          type: string
          minLength: 1
          maxLength: 160
        nameAm:
          type: string
          maxLength: 160
        descriptionEn:
          type: string
          maxLength: 2000
        descriptionAm:
          type: string
          maxLength: 2000
        basePrice:
          $ref: '#/components/schemas/Money'
        availableNow:
          type: boolean
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/ModifierDraft'
          minItems: 0
          maxItems: 10
      required:
      - id
      - nameEn
      - basePrice
      - availableNow
      - modifiers
    SectionDraft:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        nameEn:
          type: string
          minLength: 1
          maxLength: 120
        nameAm:
          type: string
          maxLength: 120
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemDraft'
          minItems: 0
          maxItems: 200
      required:
      - id
      - nameEn
      - items
    MenuDraftInput:
      type: object
      additionalProperties: false
      properties:
        themeId:
          type: string
          enum:
          - mini-minimal-slate
          - mini-warm-habesha
          - mini-bole-bistro
          - mini-fresh-organic
          - mini-street-burger
          - mini-artisan-roastery
        primaryColor:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionDraft'
          minItems: 1
          maxItems: 40
      required:
      - themeId
      - primaryColor
      - sections
      description: Validated persistent catalog content. At most 1000 total items
        and a 1 MB JSON body; IDs are unique across sections/items/options. Draft
        edits do not alter a publication. These are technical payload limits, not
        commercial plan allowances.
    MenuDraft:
      type: object
      additionalProperties: false
      properties:
        venueId: *id005
        version:
          type: integer
          minimum: 1
        content:
          $ref: '#/components/schemas/MenuDraftInput'
      required:
      - venueId
      - version
      - content
    PublishMenu:
      type: object
      additionalProperties: false
      properties:
        draftVersion:
          type: integer
          minimum: 1
        profileVersion: &id006
          type: integer
          minimum: 1
      required:
      - draftVersion
      - profileVersion
    PublicMenu:
      type: object
      additionalProperties: false
      properties:
        publicationId: *id005
        revision:
          type: integer
          minimum: 1
        venueId: *id005
        venueName:
          type: string
          maxLength: 160
        currency:
          type: string
          const: ETB
        content:
          $ref: '#/components/schemas/MenuDraftInput'
        branch:
          $ref: '#/components/schemas/SetupBranch'
        availabilityRevision: *id006
      required:
      - publicationId
      - revision
      - venueId
      - venueName
      - currency
      - content
      - branch
      - availabilityRevision
    PositiveMoney:
      allOf:
      - $ref: '#/components/schemas/Money'
      - not:
          const: '0.00'
    SaveMenuDraft:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        content:
          $ref: '#/components/schemas/MenuDraftInput'
      required:
      - expectedVersion
      - content
    BranchRole:
      type: string
      enum:
      - MANAGER
      - WAITER
      - CASHIER
      - PREPARATION
      - EDITOR
    Principal:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        businessId: *id001
        plan:
          type: string
          enum:
          - FREE
          - MINI
          - PRO
        branchLimit: *id006
        permissions:
          type: array
          items: *id007
          maxItems: 100
      required:
      - userId
      - businessId
      - plan
      - branchLimit
      - permissions
      allOf:
      - if:
          properties:
            plan:
              const: MINI
        then:
          properties:
            branchLimit:
              maximum: 2
      - if:
          properties:
            plan:
              const: FREE
        then:
          properties:
            branchLimit:
              const: 1
    Branch:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id007
        publicSlug: *id007
        orderingEnabled:
          type: boolean
      required:
      - id
      - name
      - publicSlug
      - orderingEnabled
    CreateBranch:
      type: object
      additionalProperties: false
      properties:
        name: *id007
        publicSlug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      required:
      - name
      - publicSlug
    StaffAssignment:
      type: object
      additionalProperties: false
      properties:
        branchId: *id001
        userId: *id001
        role:
          $ref: '#/components/schemas/BranchRole'
        active:
          type: boolean
      required:
      - branchId
      - userId
      - role
      - active
    AssignStaff:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        role:
          $ref: '#/components/schemas/BranchRole'
        active:
          type: boolean
      required:
      - userId
      - role
      - active
    Visit:
      type: object
      additionalProperties: false
