    RecoveryReceipt:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          enum:
          - GUEST
          - PAYER
          - SERVICE
          - CASHIER
        operation:
          type: string
          enum:
          - SUBMIT
          - CLAIM
          - CREATE_TABLE
          - UPDATE_TABLE
          - OPEN_STAFF_VISIT
          - END_VISIT
          - SUBMIT_STAFF_ORDER
          - TRANSITION_ORDER
          - FINALIZE_BILL
          - CLOSE_BILL
          - CREDIT_BILL
          - RECORD_RECEIPT
          - ALLOCATE_RECEIPT
          - REVIEW_CLAIM
          - REQUEST_REFUND
          - REVIEW_REFUND
          - EXECUTE_REFUND
        requestKey: *id001
        resourceId: *id001
        state:
          type: string
          enum:
          - COMMITTED
          - NOT_RECORDED
          - CANCELLED
        resultId:
          anyOf:
          - *id001
          - type: 'null'
        recordedAt:
          anyOf:
          - *id010
          - type: 'null'
      required:
      - domain
      - operation
      - requestKey
      - resourceId
      - state
      - resultId
      - recordedAt
      allOf:
      - if:
          properties:
            state:
              const: COMMITTED
        then:
          properties:
            resultId: *id001
            recordedAt: *id010
        else:
          properties:
            resultId:
              type: 'null'
      - if:
          properties:
            state:
              const: NOT_RECORDED
        then:
          properties:
            recordedAt:
              type: 'null'
        else:
          properties:
            recordedAt: *id010
      - if:
          properties:
            domain:
              const: GUEST
        then:
          properties:
            operation:
              type: string
              enum:
              - SUBMIT
      - if:
          properties:
            domain:
              const: PAYER
        then:
          properties:
            operation:
              type: string
              enum:
              - CLAIM
      - if:
          properties:
            domain:
              const: SERVICE
        then:
          properties:
            operation:
              type: string
              enum:
              - CREATE_TABLE
              - UPDATE_TABLE
              - OPEN_STAFF_VISIT
              - END_VISIT
              - SUBMIT_STAFF_ORDER
              - TRANSITION_ORDER
      - if:
          properties:
            domain:
              const: CASHIER
        then:
          properties:
            operation:
              type: string
              enum:
              - FINALIZE_BILL
              - CLOSE_BILL
              - CREDIT_BILL
              - RECORD_RECEIPT
              - ALLOCATE_RECEIPT
              - REVIEW_CLAIM
              - REQUEST_REFUND
              - REVIEW_REFUND
              - EXECUTE_REFUND
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Stable UUID for the same command retry. A different body with this
        key is a 409 conflict.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"1"'
      description: Expected resource version; reject stale commands without mutation.
  responses:
    '400':
      description: Malformed request or missing command header
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '401':
      description: Missing, expired or revoked session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '403':
      description: Authenticated operator lacks this permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '404':
      description: Resource absent or outside the principal scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '409':
      description: Idempotency, version, price, availability or payment conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '422':
      description: All schema/business validation failures
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '429':
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
    '503':
      description: Temporary server/database unavailability; safe command retry
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: menu_staff_session
      description: Validated, revocable staff session; HttpOnly and Secure in production.
    diningSession:
      type: apiKey
      in: cookie
      name: __Host-menu_dining
      description: Opaque 256-bit HttpOnly host-only session cookie, Secure and SameSite
        Strict. Local HTTP fixture uses menu_dining. No UUID/header identity override.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for unsafe cookie-authenticated staff commands; also verify
        Origin.
    billAccess:
      type: apiKey
      in: cookie
      name: __Host-menu_bill_access
      description: Hashed scoped payer capability; issued by authorized staff, HttpOnly
        and Secure in production. A table QR does not grant this access.
    platformSession:
      type: apiKey
      in: cookie
      name: menu_platform_session
      description: Separately authenticated active platform operator; cannot be inferred
        from restaurant owner membership.
