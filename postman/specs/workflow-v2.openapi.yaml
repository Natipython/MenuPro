      x-implementation: implemented safe public PostgreSQL projection; explicitly
        configured limited database connection required
  /dining-sessions:
    post:
      operationId: createDiningSession
      summary: Establish own guest session; table QR alone does not associate a visit
      description: Establish own guest session; table QR alone does not associate
        a visit Cookie capability is verified server-side on every request. UUIDs
        and client identity headers grant no access. Mutations require exact Origin
        and bounded JSON; authenticated mutations also require session-bound CSRF.
        Table access never grants a visit or payer access. No private token appears
        in URLs or server logs. Session creation never silently replaces an existing
        session.
